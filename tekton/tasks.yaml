apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm
spec:
  description: Install Node.js dependencies using npm
  params:
    - name: ARGS
      description: npm command arguments
      type: array
      default: ["install"]
  workspaces:
    - name: source
      description: Workspace containing the cloned source code
  steps:
    - name: npm
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      command: ["npm"]
      args: ["$(params.ARGS[*])"]
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  description: Run Jasmine unit tests
  workspaces:
    - name: source
      description: Workspace containing the source code with dependencies installed
  steps:
    - name: jasmine
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      command: ["npm"]
      args: ["test", "--", "--config=jasmine.json"]
